name: Configure Listello Apple signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-listello-apple-signing
  cancel-in-progress: true

jobs:
  configure:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAM_ID: 6YYA8L76Y8

    steps:
      - name: Check out Listello
        uses: actions/checkout@v7
        with:
          repository: krabople/Morrow-iOS
          ref: main
          path: Listello

      - name: Validate Apple credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Listello project
        working-directory: Listello
        run: |
          set -euo pipefail
          swift Support/generate-icon.swift Artwork/ListelloSource.jpg Listello/Resources/Assets.xcassets/AppIcon.appiconset/ListelloIcon-1024.png
          ruby -i -ne 'print unless /^\s+(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER):/' project.yml
          xcodegen generate

      - name: Import Apple distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/listello-api-key"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "APPSTORE_KEY_PATH=$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Report Listello capabilities
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(value) = Base64.urlsafe_encode64(value).delete("=")
          def fixed_width(value) = [value.to_i.to_s(16).rjust(64, "0")].pack("H*")

          now = Time.now.to_i
          header = base64url({alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT"}.to_json)
          payload = base64url({iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          signature = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
          parts = OpenSSL::ASN1.decode(signature).value
          token = "#{unsigned}.#{base64url(parts.map { |part| fixed_width(part.value) }.join)}"

          uri = URI("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=com.krabople.morrow&include=bundleIdCapabilities&fields[bundleIds]=name,identifier&fields[bundleIdCapabilities]=capabilityType,settings")
          request = Net::HTTP::Get.new(uri)
          request["Authorization"] = "Bearer #{token}"
          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
          abort "Capability lookup failed (HTTP #{response.code}): #{response.body}" unless response.is_a?(Net::HTTPSuccess)
          body = JSON.parse(response.body)
          capabilities = body.fetch("included", []).map { |item| item.fetch("attributes") }
          puts JSON.pretty_generate(capabilities)
          RUBY

      - name: Configure capabilities and verify distribution signing
        working-directory: Listello
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Listello.xcodeproj \
            -scheme Listello \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath .build/Archives/Listello-Signing-Check.xcarchive \
            -derivedDataPath .build/DerivedData-Signing-Check \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | xcbeautify --renderer github-actions

          codesign -d --entitlements :- \
            .build/Archives/Listello-Signing-Check.xcarchive/Products/Applications/Listello.app
