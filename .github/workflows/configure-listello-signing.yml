name: Configure Listello Apple signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-listello-apple-signing
  cancel-in-progress: true

jobs:
  configure:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAM_ID: 6YYA8L76Y8

    steps:
      - name: Check out Listello
        uses: actions/checkout@v7
        with:
          repository: krabople/Morrow-iOS
          ref: main
          path: Listello

      - name: Validate Apple credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Listello project
        working-directory: Listello
        run: |
          set -euo pipefail
          swift Support/generate-icon.swift Artwork/ListelloSource.jpg Listello/Resources/Assets.xcassets/AppIcon.appiconset/ListelloIcon-1024.png
          ruby -i -ne 'print unless /^\s+(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER):/' project.yml
          xcodegen generate

      - name: Import Apple distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/listello-api-key"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "APPSTORE_KEY_PATH=$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Configure Listello capabilities and App Store profile
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "digest"
          require "net/http"
          require "openssl"
          require "fileutils"
          require "uri"

          def base64url(value) = Base64.urlsafe_encode64(value).delete("=")
          def fixed_width(value) = [value.to_i.to_s(16).rjust(64, "0")].pack("H*")

          now = Time.now.to_i
          header = base64url({alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT"}.to_json)
          payload = base64url({iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          signature = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
          parts = OpenSSL::ASN1.decode(signature).value
          token = "#{unsigned}.#{base64url(parts.map { |part| fixed_width(part.value) }.join)}"

          def api(method, path, token, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            request_class = {
              get: Net::HTTP::Get,
              post: Net::HTTP::Post,
              delete: Net::HTTP::Delete
            }.fetch(method)
            request = request_class.new(uri)
            request["Authorization"] = "Bearer #{token}"
            if body
              request["Content-Type"] = "application/json"
              request.body = JSON.generate(body)
            end
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
            abort "Apple API #{method.upcase} #{path} failed (HTTP #{response.code}): #{response.body}" unless response.is_a?(Net::HTTPSuccess)
            response.body.empty? ? {} : JSON.parse(response.body)
          end

          bundle_response = api(
            :get,
            "/v1/bundleIds?filter[identifier]=com.krabople.morrow&include=bundleIdCapabilities&fields[bundleIds]=name,identifier&fields[bundleIdCapabilities]=capabilityType,settings",
            token
          )
          bundle = bundle_response.fetch("data").first or abort "Listello bundle ID was not found"
          bundle_id = bundle.fetch("id")
          enabled = bundle_response.fetch("included", []).filter_map do |item|
            item.dig("attributes", "capabilityType") if item["type"] == "bundleIdCapabilities"
          end

          capability_settings = {
            "ICLOUD" => [{
              key: "ICLOUD_VERSION",
              options: [{key: "XCODE_6", enabled: true}]
            }],
            "PUSH_NOTIFICATIONS" => nil
          }

          capability_settings.each do |capability_type, settings|
            next if enabled.include?(capability_type)
            attributes = {capabilityType: capability_type}
            attributes[:settings] = settings if settings
            api(:post, "/v1/bundleIdCapabilities", token, {
              data: {
                type: "bundleIdCapabilities",
                attributes: attributes,
                relationships: {
                  bundleId: {data: {type: "bundleIds", id: bundle_id}}
                }
              }
            })
            puts "Enabled #{capability_type}"
          end

          certificates_response = api(
            :get,
            "/v1/certificates?fields[certificates]=name,certificateType,displayName,serialNumber,certificateContent,expirationDate&limit=200",
            token
          )
          p12 = OpenSSL::PKCS12.new(
            Base64.decode64(ENV.fetch("BUILD_CERTIFICATE_BASE64")),
            ENV.fetch("P12_PASSWORD")
          )
          local_fingerprint = Digest::SHA1.hexdigest(p12.certificate.to_der)
          distribution_certificate = certificates_response.fetch("data").find do |certificate|
            content = certificate.dig("attributes", "certificateContent")
            next false unless content
            remote = OpenSSL::X509::Certificate.new(Base64.decode64(content))
            Digest::SHA1.hexdigest(remote.to_der) == local_fingerprint
          end
          abort "The imported Apple Distribution certificate was not found in the developer account" unless distribution_certificate
          certificate_id = distribution_certificate.fetch("id")

          profile_name = "AppStore Listello iCloud GitHub"
          profiles_response = api(
            :get,
            "/v1/profiles?filter[profileType]=IOS_APP_STORE&fields[profiles]=name,uuid,profileContent,profileState,profileType&limit=200",
            token
          )
          existing = profiles_response.fetch("data").find { |profile| profile.dig("attributes", "name") == profile_name }
          if existing
            api(:delete, "/v1/profiles/#{existing.fetch("id")}", token)
          end

          profile_response = api(:post, "/v1/profiles", token, {
            data: {
              type: "profiles",
              attributes: {
                name: profile_name,
                profileType: "IOS_APP_STORE"
              },
              relationships: {
                bundleId: {data: {type: "bundleIds", id: bundle_id}},
                certificates: {data: [{type: "certificates", id: certificate_id}]}
              }
            }
          })
          profile = profile_response.fetch("data")
          attributes = profile.fetch("attributes")
          profile_path = File.join(ENV.fetch("RUNNER_TEMP"), "Listello-iCloud.mobileprovision")
          File.binwrite(profile_path, Base64.decode64(attributes.fetch("profileContent")))
          install_dir = File.expand_path("~/Library/MobileDevice/Provisioning Profiles")
          FileUtils.mkdir_p(install_dir)
          FileUtils.cp(profile_path, File.join(install_dir, "#{attributes.fetch("uuid")}.mobileprovision"))
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
            file.puts "LISTELLO_PROFILE_PATH=#{profile_path}"
            file.puts "LISTELLO_PROFILE_NAME=#{profile_name}"
          end
          puts "Created #{profile_name} (#{attributes.fetch("uuid")})"
          RUBY

      - name: Verify profile entitlements and distribution signing
        working-directory: Listello
        run: |
          set -euo pipefail
          security cms -D -i "$LISTELLO_PROFILE_PATH" > "$RUNNER_TEMP/Listello-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$RUNNER_TEMP/Listello-profile.plist" \
            | grep -F 'iCloud.com.krabople.morrow'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/Listello-profile.plist"

          xcodebuild archive \
            -project Listello.xcodeproj \
            -scheme Listello \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath .build/Archives/Listello-Signing-Check.xcarchive \
            -derivedDataPath .build/DerivedData-Signing-Check \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$LISTELLO_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | xcbeautify --renderer github-actions

          codesign -d --entitlements :- \
            .build/Archives/Listello-Signing-Check.xcarchive/Products/Applications/Listello.app
