name: Configure Listello Apple signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-listello-apple-signing
  cancel-in-progress: true

jobs:
  configure:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAM_ID: 6YYA8L76Y8

    steps:
      - name: Check out Listello
        uses: actions/checkout@v7
        with:
          repository: krabople/Morrow-iOS
          ref: main
          path: Listello

      - name: Validate Apple credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate automatically signed project
        working-directory: Listello
        run: |
          set -euo pipefail
          swift Support/generate-icon.swift Artwork/ListelloSource.jpg Listello/Resources/Assets.xcassets/AppIcon.appiconset/ListelloIcon-1024.png
          ruby -i -ne 'print unless /^\s+(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER):/' project.yml
          xcodegen generate

      - name: Import Apple distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create and import a retained development identity
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IDENTITY_DIR="$RUNNER_TEMP/listello-development-identity"
          mkdir -p "$IDENTITY_DIR"
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$IDENTITY_DIR/private.key" \
            -out "$IDENTITY_DIR/request.csr" \
            -subj "/CN=Listello GitHub Development"

          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(value) = Base64.urlsafe_encode64(value).delete("=")
          def fixed_width(value) = [value.to_i.to_s(16).rjust(64, "0")].pack("H*")

          now = Time.now.to_i
          header = base64url({alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT"}.to_json)
          payload = base64url({iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          asn1 = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
          parts = OpenSSL::ASN1.decode(asn1).value
          token = "#{unsigned}.#{base64url(parts.map { |part| fixed_width(part.value) }.join)}"

          identity_dir = File.join(ENV.fetch("RUNNER_TEMP"), "listello-development-identity")
          body = {
            data: {
              type: "certificates",
              attributes: {
                certificateType: "DEVELOPMENT",
                csrContent: File.read(File.join(identity_dir, "request.csr"))
              }
            }
          }
          uri = URI("https://api.appstoreconnect.apple.com/v1/certificates")
          request = Net::HTTP::Post.new(uri)
          request["Authorization"] = "Bearer #{token}"
          request["Content-Type"] = "application/json"
          request.body = JSON.generate(body)
          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
          abort "Certificate creation failed (HTTP #{response.code}): #{response.body}" unless response.is_a?(Net::HTTPSuccess)
          certificate = JSON.parse(response.body).fetch("data")
          File.binwrite(
            File.join(identity_dir, "certificate.cer"),
            Base64.decode64(certificate.fetch("attributes").fetch("certificateContent"))
          )
          puts "Created development certificate #{certificate.fetch("id")} with its private key retained in this runner."
          RUBY

          openssl x509 -inform DER \
            -in "$IDENTITY_DIR/certificate.cer" \
            -out "$IDENTITY_DIR/certificate.pem"
          DEV_P12_PASSWORD="$(openssl rand -hex 24)"
          openssl pkcs12 -export \
            -inkey "$IDENTITY_DIR/private.key" \
            -in "$IDENTITY_DIR/certificate.pem" \
            -out "$IDENTITY_DIR/development.p12" \
            -passout "pass:$DEV_P12_PASSWORD"
          security import "$IDENTITY_DIR/development.p12" \
            -P "$DEV_P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign
          security find-identity -v -p codesigning

      - name: Provision capabilities and archive
        working-directory: Listello
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild archive \
            -project Listello.xcodeproj \
            -scheme Listello \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath .build/Archives/Listello-Signing-Check.xcarchive \
            -derivedDataPath .build/DerivedData-Signing-Check \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | xcbeautify --renderer github-actions

      - name: Verify signed iCloud entitlements
        working-directory: Listello
        run: |
          set -euo pipefail
          APP_PATH=".build/Archives/Listello-Signing-Check.xcarchive/Products/Applications/Listello.app"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/listello-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-container-identifiers" "$RUNNER_TEMP/listello-entitlements.plist" \
            | grep -F "iCloud.com.krabople.morrow"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/listello-entitlements.plist" \
            | grep -E "development|production"
          echo "Listello archive contains its iCloud container and push entitlement."
