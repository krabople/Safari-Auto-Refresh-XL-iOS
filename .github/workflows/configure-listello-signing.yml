name: Configure Listello Apple signing

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Build and upload the current Listello main branch to TestFlight
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: configure-listello-apple-signing
  cancel-in-progress: true

jobs:
  configure:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: 6YYA8L76Y8

    steps:
      - name: Check out Listello
        uses: actions/checkout@v7
        with:
          repository: krabople/Morrow-iOS
          ref: main
          path: Listello

      - name: Validate Apple credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate automatically signed project
        working-directory: Listello
        run: |
          set -euo pipefail
          swift Support/generate-icon.swift Artwork/ListelloSource.jpg Listello/Resources/Assets.xcassets/AppIcon.appiconset/ListelloIcon-1024.png
          ruby -i -ne 'print unless /^\s+(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER):/' project.yml
          xcodegen generate

      - name: Import Apple distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create and install a Listello App Store profile
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$RUNNER_TEMP/listello-signing-profile"
          mkdir -p "$PROFILE_DIR"
          security find-certificate -c "Apple Distribution" -p signing_temp.keychain \
            | openssl x509 -noout -serial \
            | cut -d= -f2 > "$PROFILE_DIR/certificate-serial"

          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(value) = Base64.urlsafe_encode64(value).delete("=")
          def fixed_width(value) = [value.to_i.to_s(16).rjust(64, "0")].pack("H*")

          now = Time.now.to_i
          header = base64url({alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT"}.to_json)
          payload = base64url({iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          asn1 = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
          parts = OpenSSL::ASN1.decode(asn1).value
          token = "#{unsigned}.#{base64url(parts.map { |part| fixed_width(part.value) }.join)}"

          profile_dir = File.join(ENV.fetch("RUNNER_TEMP"), "listello-signing-profile")
          serial = File.read(File.join(profile_dir, "certificate-serial")).strip.upcase
          certificates_uri = URI("https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=DISTRIBUTION&limit=200")
          certificates_request = Net::HTTP::Get.new(certificates_uri)
          certificates_request["Authorization"] = "Bearer #{token}"
          certificates_response = Net::HTTP.start(certificates_uri.hostname, certificates_uri.port, use_ssl: true) { |http| http.request(certificates_request) }
          abort "Certificate lookup failed (HTTP #{certificates_response.code}): #{certificates_response.body}" unless certificates_response.is_a?(Net::HTTPSuccess)
          certificate = JSON.parse(certificates_response.body).fetch("data").find do |candidate|
            candidate.fetch("attributes").fetch("serialNumber").upcase == serial
          end
          abort "The imported Apple Distribution certificate was not found in App Store Connect." unless certificate

          profile_name = "Listello iCloud Signing Check #{ENV.fetch("GITHUB_RUN_ID")}"
          body = {
            data: {
              type: "profiles",
              attributes: {
                name: profile_name,
                profileType: "IOS_APP_STORE"
              },
              relationships: {
                bundleId: {data: {type: "bundleIds", id: "ALQR4P268Z"}},
                certificates: {data: [{type: "certificates", id: certificate.fetch("id")}]}
              }
            }
          }
          uri = URI("https://api.appstoreconnect.apple.com/v1/profiles")
          request = Net::HTTP::Post.new(uri)
          request["Authorization"] = "Bearer #{token}"
          request["Content-Type"] = "application/json"
          request.body = JSON.generate(body)
          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
          abort "Profile creation failed (HTTP #{response.code}): #{response.body}" unless response.is_a?(Net::HTTPSuccess)
          profile = JSON.parse(response.body).fetch("data")
          File.binwrite(
            File.join(profile_dir, "Listello.mobileprovision"),
            Base64.decode64(profile.fetch("attributes").fetch("profileContent"))
          )
          File.write(File.join(profile_dir, "profile-id"), profile.fetch("id"))
          File.write(File.join(profile_dir, "profile-name"), profile_name)
          puts "Created App Store profile #{profile.fetch("id")} for the imported distribution identity."
          RUBY

          security cms -D -i "$PROFILE_DIR/Listello.mobileprovision" > "$PROFILE_DIR/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_DIR/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_DIR/Listello.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "LISTELLO_PROFILE_NAME=$(cat "$PROFILE_DIR/profile-name")" >> "$GITHUB_ENV"

      - name: Provision capabilities and build signed app
        if: ${{ !inputs.upload_to_testflight }}
        working-directory: Listello
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project Listello.xcodeproj \
            -scheme Listello \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build/DerivedData-Signing-Check \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$LISTELLO_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            | xcbeautify --renderer github-actions

      - name: Verify signed iCloud entitlements
        if: ${{ !inputs.upload_to_testflight }}
        working-directory: Listello
        run: |
          set -euo pipefail
          APP_PATH=".build/DerivedData-Signing-Check/Build/Products/Release-iphoneos/Listello.app"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/listello-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.ubiquity-kvstore-identifier" "$RUNNER_TEMP/listello-entitlements.plist" \
            | grep -F "com.krabople.morrow"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/listello-entitlements.plist" \
            | grep -E "development|production"
          echo "Listello signed device build contains its iCloud key-value and push entitlements."

      - name: Generate unique TestFlight build number
        if: ${{ inputs.upload_to_testflight }}
        run: echo "LISTELLO_BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive and export signed TestFlight IPA
        if: ${{ inputs.upload_to_testflight }}
        id: testflight
        working-directory: Listello
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild archive \
            -project Listello.xcodeproj \
            -scheme Listello \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath .build/Archives/Listello.xcarchive \
            -derivedDataPath .build/DerivedData-TestFlight \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$LISTELLO_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$LISTELLO_BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

          cp Support/ExportOptions.plist "$RUNNER_TEMP/ListelloExportOptions.plist"
          perl -0pi -e 's/AppStore Morrow Shared GitHub/$ENV{LISTELLO_PROFILE_NAME}/g' "$RUNNER_TEMP/ListelloExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath .build/Archives/Listello.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ListelloExportOptions.plist" \
            -exportPath .build/Export \
            | xcbeautify --renderer github-actions

          IPA_PATH="$(find "$PWD/.build/Export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "ipa-path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify TestFlight package
        if: ${{ inputs.upload_to_testflight }}
        working-directory: Listello
        run: |
          set -euo pipefail
          IPA_PATH="${{ steps.testflight.outputs.ipa-path }}"
          AUDIT_DIR="$(mktemp -d "$RUNNER_TEMP/listello-ipa-audit.XXXXXX")"
          unzip -q "$IPA_PATH" -d "$AUDIT_DIR"
          APP_BUNDLE="$(find "$AUDIT_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          INFO_PLIST="$APP_BUNDLE/Info.plist"

          codesign -d --entitlements :- "$APP_BUNDLE" > "$RUNNER_TEMP/listello-testflight-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.ubiquity-kvstore-identifier" "$RUNNER_TEMP/listello-testflight-entitlements.plist" \
            | grep -F "com.krabople.morrow"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/listello-testflight-entitlements.plist" \
            | grep -F "production"

          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$INFO_PLIST")"
          test "$ICON_NAME" = "AppIcon"
          find_icon_with_size() {
            expected="$1"
            find "$APP_BUNDLE" -maxdepth 1 -type f -name '*.png' -print | while IFS= read -r icon; do
              width="$(sips -g pixelWidth "$icon" 2>/dev/null | awk '/pixelWidth/ {print $2}')"
              height="$(sips -g pixelHeight "$icon" 2>/dev/null | awk '/pixelHeight/ {print $2}')"
              if [ "$width" = "$expected" ] && [ "$height" = "$expected" ]; then
                echo "$icon"
              fi
            done
          }
          test -n "$(find_icon_with_size 120)"
          test -n "$(find_icon_with_size 152)"
          echo "Verified production iCloud, push, and required app-icon packaging."

      - name: Keep signed TestFlight IPA as an artifact
        if: ${{ inputs.upload_to_testflight }}
        uses: actions/upload-artifact@v7
        with:
          name: Listello-TestFlight-IPA-${{ env.LISTELLO_BUILD_NUMBER }}
          path: ${{ steps.testflight.outputs.ipa-path }}
          if-no-files-found: error

      - name: Upload Listello to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.testflight.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          wait-for-processing: "false"

      - name: Confirm Apple processing completed
        if: ${{ inputs.upload_to_testflight }}
        working-directory: Listello
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_STORE_APP_ID: "6809041904"
          BUILD_NUMBER: ${{ env.LISTELLO_BUILD_NUMBER }}
        run: ruby Support/check-testflight.rb

      - name: Delete temporary App Store profile
        if: always()
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PROFILE_ID_FILE="$RUNNER_TEMP/listello-signing-profile/profile-id"
          [ -f "$PROFILE_ID_FILE" ] || exit 0
          export LISTELLO_TEMP_PROFILE_ID="$(cat "$PROFILE_ID_FILE")"
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(value) = Base64.urlsafe_encode64(value).delete("=")
          def fixed_width(value) = [value.to_i.to_s(16).rjust(64, "0")].pack("H*")

          now = Time.now.to_i
          header = base64url({alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT"}.to_json)
          payload = base64url({iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          asn1 = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
          parts = OpenSSL::ASN1.decode(asn1).value
          token = "#{unsigned}.#{base64url(parts.map { |part| fixed_width(part.value) }.join)}"

          profile_id = ENV.fetch("LISTELLO_TEMP_PROFILE_ID")
          uri = URI("https://api.appstoreconnect.apple.com/v1/profiles/#{profile_id}")
          request = Net::HTTP::Delete.new(uri)
          request["Authorization"] = "Bearer #{token}"
          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
          abort "Profile cleanup failed (HTTP #{response.code}): #{response.body}" unless [204, 404].include?(response.code.to_i)
          puts "Deleted temporary App Store profile #{profile_id}."
          RUBY
