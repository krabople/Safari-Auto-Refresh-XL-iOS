name: Check Listello TestFlight build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Listello build number to wait for
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Listello
        uses: actions/checkout@v7
        with:
          repository: krabople/Morrow-iOS
          ref: main
          path: Listello

      - name: Wait for Apple processing
        working-directory: Listello
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_STORE_APP_ID: "6809041904"
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: ruby Support/check-testflight.rb
