name: Build iOS Safari Extension App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install Apple Distribution Certificate & Provisioning Profile
      if: env.BUILD_CERTIFICATE_BASE64 != ''
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      run: |
        echo "=== Installing Apple Distribution Certificate & Provisioning Profile ==="
        CERT_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        security create-keychain -p "" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "" $KEYCHAIN_PATH

        security import $CERT_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A
        security list-keychains -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build WebExtension & iOS App IPA
      run: |
        set -e
        echo "=== 1. Locating WebExtension Resources ==="
        MANIFEST_PATH="$GITHUB_WORKSPACE/AutoRefreshXLExtension/Resources/manifest.json"

        if [ ! -f "$MANIFEST_PATH" ]; then
          echo "Error: manifest.json not found in repository."
          exit 1
        fi

        RESOURCES_DIR=$(dirname "$MANIFEST_PATH")
        FULL_RES_PATH=$(cd "$RESOURCES_DIR" && pwd)
        echo "WebExtension directory: $FULL_RES_PATH"

        echo "=== 2. Converting Web Extension to iOS Xcode Project ==="
        rm -rf "$GITHUB_WORKSPACE/GeneratedProject"
        
        xcrun safari-web-extension-converter "$FULL_RES_PATH" --swift --ios-only --no-open --no-prompt --force --project-location "$GITHUB_WORKSPACE/GeneratedProject"
        
        echo "=== 2b. Injecting Custom Host App Components ==="
        VC_PATH=$(find "$GITHUB_WORKSPACE/GeneratedProject" -name "ViewController.swift" | head -n 1)
        if [ -n "$VC_PATH" ]; then
          PROJ_APP_DIR=$(dirname "$VC_PATH")
          cp "$GITHUB_WORKSPACE/AutoRefreshXL/ViewController.swift" "$PROJ_APP_DIR/ViewController.swift"
          cp "$GITHUB_WORKSPACE/AutoRefreshXL/AppDelegate.swift" "$PROJ_APP_DIR/AppDelegate.swift"
          cp "$GITHUB_WORKSPACE/AutoRefreshXL/SceneDelegate.swift" "$PROJ_APP_DIR/SceneDelegate.swift"
          echo "Successfully injected custom ViewController, AppDelegate & SceneDelegate at $PROJ_APP_DIR"
        fi

        HANDLER_PATH=$(find "$GITHUB_WORKSPACE/GeneratedProject" -name "SafariWebExtensionHandler.swift" | head -n 1)
        if [ -n "$HANDLER_PATH" ]; then
          cp "$GITHUB_WORKSPACE/AutoRefreshXLExtension/SafariWebExtensionHandler.swift" "$HANDLER_PATH"
          echo "Successfully injected native SafariWebExtensionHandler.swift at $HANDLER_PATH"
        fi

        echo "=== 2c. Updating Bundle Identifiers & Display Name for App Store Connect ==="
        find "$GITHUB_WORKSPACE/GeneratedProject" -name "project.pbxproj" -type f | while read -r pbx; do
          sed -i '' 's/com\.yourCompany\.Safari-Auto-Refresh-and-Page-Monitor-XL/com.yourCompany.Safari-Auto-Refresh-and-Page-Monitor-XL.6YYA8L76Y8/g' "$pbx"
        done

        find "$GITHUB_WORKSPACE/GeneratedProject" -name "Info.plist" -type f -print0 | while IFS= read -r -d '' PLIST_PATH; do
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Auto Refresh XL" "$PLIST_PATH" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Auto Refresh XL" "$PLIST_PATH"
        done

        echo "=== 2d. Preserving Extension Entitlements for Native Messaging ==="
        # Do not wipe extension entitlements so RunningBoardServices can launch the extension plugin

        cd "$GITHUB_WORKSPACE"

        echo "=== 3. Locating Generated Xcode Project ==="
        XCODEPROJ=$(find ./GeneratedProject -name "*.xcodeproj" | head -n 1)
        if [ -z "$XCODEPROJ" ]; then
          echo "Error: Xcode project failed to generate."
          exit 1
        fi
        
        PROJ_DIR=$(dirname "$XCODEPROJ")
        PROJ_NAME=$(basename "$XCODEPROJ")
        echo "Found Xcode project: $PROJ_NAME at $PROJ_DIR"

        cd "$PROJ_DIR"

        echo "=== 4. Identifying Build Schemes ==="
        xcodebuild -list -project "$PROJ_NAME"
        
        # Dynamically find the iOS App scheme
        SCHEME=$(xcodebuild -list -project "$PROJ_NAME" | grep -A 15 "Schemes:" | tail -n +2 | sed 's/^[ \t]*//' | grep "(iOS)" | head -n 1)
        if [ -z "$SCHEME" ]; then
          SCHEME=$(xcodebuild -list -project "$PROJ_NAME" | grep -A 15 "Schemes:" | tail -n +2 | sed 's/^[ \t]*//' | head -n 1)
        fi
        
        echo "Selected Scheme: '$SCHEME'"

        echo "=== 5. Compiling iOS Application with Apple Distribution Certificate ==="
        xcodebuild -project "$PROJ_NAME" \
                   -scheme "$SCHEME" \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath "$GITHUB_WORKSPACE/build" \
                   CODE_SIGN_IDENTITY="Apple Distribution" \
                   CODE_SIGNING_REQUIRED=NO \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   INFOPLIST_KEY_CFBundleDisplayName="Auto Refresh XL" \
                   build

        echo "=== 6. Locating Compiled .app Bundle ==="
        APP_PATH=$(find "$GITHUB_WORKSPACE/build" -name "*.app" -type d | grep -v "\.appex" | head -n 1)

        if [ -z "$APP_PATH" ]; then
          echo "Error: Could not locate compiled .app file in $GITHUB_WORKSPACE/build."
          exit 1
        fi

        echo "Found compiled iOS app at: $APP_PATH"

        echo "=== 7. Packaging IPA for TestFlight ==="
        rm -rf ./Payload SafariAutoRefreshXL.ipa
        mkdir -p ./Payload
        cp -R "$APP_PATH" ./Payload/
        zip -r SafariAutoRefreshXL.ipa Payload

    - name: Upload IPA Artifact for Sideloadly
      uses: actions/upload-artifact@v4
      with:
        name: SafariAutoRefreshXL-IPA
        path: SafariAutoRefreshXL.ipa

    - name: Upload to TestFlight (App Store Connect)
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: 'SafariAutoRefreshXL.ipa'
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
