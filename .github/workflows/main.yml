name: Build and upload iOS app to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      TEAM_ID: 6YYA8L76Y8
      APP_BUNDLE_ID: com.yourCompany.Safari-Auto-Refresh-and-Page-Monitor-XL.6YYA8L76Y8
      EXTENSION_BUNDLE_ID: com.yourCompany.Safari-Auto-Refresh-and-Page-Monitor-XL.6YYA8L76Y8.Extension
      MARKETING_VERSION: 1.2.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Validate release secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_EXTENSION_PROVISION_PROFILE_BASE64 }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 BUILD_EXTENSION_PROVISION_PROFILE_BASE64 APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_EXTENSION_PROVISION_PROFILE_BASE64 }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          EXTENSION_PROFILE_PATH="$RUNNER_TEMP/extension.mobileprovision"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$BUILD_EXTENSION_PROVISION_PROFILE_BASE64" | base64 --decode > "$EXTENSION_PROFILE_PATH"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "The imported P12 does not contain a usable Apple Distribution private key." >&2
            exit 1
          fi

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          for profile in "$APP_PROFILE_PATH" "$EXTENSION_PROFILE_PATH"; do
            plist="$profile.plist"
            security cms -D -i "$profile" > "$plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            cp "$profile" "$PROFILES_DIR/$uuid.mobileprovision"
          done

          APP_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$APP_PROFILE_PATH.plist")"
          EXTENSION_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$EXTENSION_PROFILE_PATH.plist")"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "EXTENSION_PROFILE_NAME=$EXTENSION_PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          set -eu
          RESOURCES_DIR="$GITHUB_WORKSPACE/AutoRefreshXLExtension/Resources"
          test -f "$RESOURCES_DIR/manifest.json"
          rm -rf "$GITHUB_WORKSPACE/GeneratedProject"

          xcrun safari-web-extension-converter "$RESOURCES_DIR" \
            --swift --ios-only --no-open --no-prompt --force \
            --project-location "$GITHUB_WORKSPACE/GeneratedProject"

          APP_VIEW_CONTROLLER="$(find "$GITHUB_WORKSPACE/GeneratedProject" -path '*/ViewController.swift' -not -path '*Extension*' -print -quit)"
          APP_SOURCE_DIR="$(dirname "$APP_VIEW_CONTROLLER")"
          cp "$GITHUB_WORKSPACE/AutoRefreshXL/ViewController.swift" "$APP_SOURCE_DIR/ViewController.swift"
          cp "$GITHUB_WORKSPACE/AutoRefreshXL/AppDelegate.swift" "$APP_SOURCE_DIR/AppDelegate.swift"
          cp "$GITHUB_WORKSPACE/AutoRefreshXL/SceneDelegate.swift" "$APP_SOURCE_DIR/SceneDelegate.swift"

          EXTENSION_HANDLER="$(find "$GITHUB_WORKSPACE/GeneratedProject" -path '*Extension*/SafariWebExtensionHandler.swift' -print -quit)"
          cp "$GITHUB_WORKSPACE/AutoRefreshXLExtension/SafariWebExtensionHandler.swift" "$EXTENSION_HANDLER"

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/GeneratedProject" -name project.pbxproj -print -quit)"
          sed -i '' "s/com\\.yourCompany\\.Safari-Auto-Refresh-and-Page-Monitor-XL/$APP_BUNDLE_ID/g" "$PROJECT_FILE"
          sed -i '' "s/com\\.yourCompany\\.Auto-Refresh-XL/$APP_BUNDLE_ID/g" "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PROJECT_FILE"
          perl -0pi -e 's#(PRODUCT_BUNDLE_IDENTIFIER = "?\Q$ENV{APP_BUNDLE_ID}\E"?;)#$1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{APP_PROFILE_NAME}";#g' "$PROJECT_FILE"
          perl -0pi -e 's#(PRODUCT_BUNDLE_IDENTIFIER = "?\Q$ENV{EXTENSION_BUNDLE_ID}\E"?;)#$1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{EXTENSION_PROFILE_NAME}";#g' "$PROJECT_FILE"
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = \"$APP_PROFILE_NAME\";" "$PROJECT_FILE"
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = \"$EXTENSION_PROFILE_NAME\";" "$PROJECT_FILE"

          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          find "$GITHUB_WORKSPACE/GeneratedProject" -name Info.plist -type f -print0 | while IFS= read -r -d '' plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Auto Refresh XL" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Auto Refresh XL" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName Auto Refresh XL" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleName string Auto Refresh XL" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$plist"
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"
          done

          XCODE_PROJECT="$(find "$GITHUB_WORKSPACE/GeneratedProject" -name '*.xcodeproj' -print -quit)"
          SCHEME="$(xcodebuild -list -project "$XCODE_PROJECT" | awk '/Schemes:/{found=1; next} found && NF{sub(/^[[:space:]]+/, ""); print; exit}')"
          if [ -z "$SCHEME" ]; then
            echo "Unable to identify the generated iOS scheme." >&2
            xcodebuild -list -project "$XCODE_PROJECT"
            exit 1
          fi
          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Archive signed app
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AutoRefreshXL.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            INFOPLIST_KEY_CFBundleDisplayName="Auto Refresh XL" \
            INFOPLIST_KEY_CFBundleName="Auto Refresh XL" \
            INFOPLIST_KEY_CFBundleShortVersionString="$MARKETING_VERSION"

      - name: Export App Store IPA
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$APP_PROFILE_NAME</string>
              <key>$EXTENSION_BUNDLE_ID</key><string>$EXTENSION_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          rm -rf "$GITHUB_WORKSPACE/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AutoRefreshXL.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA_PATH="$(find "$GITHUB_WORKSPACE/export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRefreshXL-TestFlight-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
